version: '3.9'
# .env file example
# PORT=8080
# DB_URL=postgres://postgres:postgres@db:5432/wallet?sslmode=disable
# POSTGRES_USER=postgres
# POSTGRES_PASSWORD=postgres
# POSTGRES_DB=wallet
services:
  db:
    image: postgres:15
    container_name: wallet-app-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: wallet-app
    ports:
      - "${PORT}:${PORT}"
    environment:
      - DB_URL=${DB_URL}
    depends_on:
      - db
    entrypoint: ["/app/wait-for-db.sh", "db", "/app/entrypoint.sh"]

volumes:
  postgres_data:
