definitions:
  main.WalletOperationRequest:
    properties:
      amount:
        type: number
      operationType:
        type: string
      walletId:
        type: string
    type: object
info:
  contact: {}
paths:
  /wallet:
    post:
      consumes:
      - application/json
      description: Deposit or withdraw funds from a wallet
      parameters:
      - description: API Key
        in: header
        name: ApiKey
        required: true
        type: string
      - description: Wallet operation details
        in: body
        name: operation
        required: true
        schema:
          $ref: '#/definitions/main.WalletOperationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Perform a wallet operation (DEPOSIT or WITHDRAW)
      tags:
      - wallets
  /wallets:
    post:
      consumes:
      - application/json
      description: Create a new wallet for the authenticated user
      parameters:
      - description: API Key
        in: header
        name: ApiKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new wallet
      tags:
      - wallets
swagger: "2.0"
